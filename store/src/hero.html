<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baleen hero</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f5f2ec; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  .board {
    position: relative;
    width: 1904px;
    height: 640px;
    background: url(finals/banner.png) center / cover no-repeat;
  }
  .fluke {
    position: absolute;
    left: 52px;
    top: 214px;
    width: 306px;
    mix-blend-mode: multiply;
    opacity: 0.94;
  }
  .copy {
    position: absolute;
    left: 750px;
    top: 198px;
    width: 1000px;
    color: #f5f2ec;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 38px; height: 38px; border-radius: 9px; }
  .wordmark { font-size: 29px; font-weight: 600; letter-spacing: -0.01em; }
  h1 {
    margin: 24px 0 0;
    font-size: 52px;
    line-height: 1.14;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .providers {
    margin-top: 46px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245, 242, 236, 0.55);
  }
</style>
</head>
<body>
  <section class="board">
    <img class="fluke" src="finals/fluke-cut.png" alt="">
    <div class="copy">
      <div class="brand">
        <img src="../../public/icons/128.png" alt="">
        <span class="wordmark">Baleen</span>
      </div>
      <h1>Chat with the page<br>you're reading.</h1>
      <div class="providers">DeepSeek · Kimi · Qwen · GLM · MiniMax</div>
    </div>
  </section>
</body>
</html>
